name: Lumen APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests (자연어 17종 · 기울기 추정 · LUT 무결성 · LLM JSON)
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Assemble debug and release APKs
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Verify APKs
        run: |
          mkdir -p verification
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/release/app-release.apk | tee verification/signature-release.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/debug/app-debug.apk | tee verification/signature-debug.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging \
            app/build/outputs/apk/release/app-release.apk | tee verification/badging.txt
          cp app/build/outputs/apk/release/app-release.apk Lumen-2.0.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk Lumen-2.0.0-debug.apk
          ls -l Lumen-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-Android
          path: |
            Lumen-2.0.0.apk
            Lumen-2.0.0-debug.apk
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lumen-verification
          path: |
            verification/
            app/build/reports/tests/
            app/build/test-results/

  deliver:
    needs: [android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Lumen-Android
          path: release

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Lumen 2.0 · build ${{ github.run_number }}
          body_path: docs/RELEASE_NOTES.md
          files: |
            release/Lumen-2.0.0.apk
            release/Lumen-2.0.0-debug.apk
