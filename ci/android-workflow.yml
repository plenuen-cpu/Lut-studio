name: Lumen APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Lumen $VERSION"

      - name: Unit tests (자연어 · 기울기 · LUT 무결성 · LLM JSON · 보정 내역 문장)
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Assemble debug and release APKs
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Verify APKs
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p verification
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/release/app-release.apk | tee verification/signature-release.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/debug/app-debug.apk | tee verification/signature-debug.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging \
            app/build/outputs/apk/release/app-release.apk | tee verification/badging.txt
          cp app/build/outputs/apk/release/app-release.apk "Lumen-$VERSION.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "Lumen-$VERSION-debug.apk"
          ls -l Lumen-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-Android
          path: |
            Lumen-*.apk
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lumen-verification
          path: |
            verification/
            app/build/reports/tests/
            app/build/test-results/

  deliver:
    needs: [android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Lumen-Android
          path: release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.android.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Lumen ${{ needs.android.outputs.version }}
          body_path: docs/RELEASE_NOTES.md
          files: |
            release/Lumen-*.apk
