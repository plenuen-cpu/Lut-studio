name: FilmCam APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: filmcam-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests (LUT decode + 57 preset mapping)
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          mkdir -p verification
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/debug/app-debug.apk | tee verification/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging \
            app/build/outputs/apk/debug/app-debug.apk | tee verification/badging.txt
          cp app/build/outputs/apk/debug/app-debug.apk FilmCam-debug.apk
          ls -l FilmCam-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FilmCam-Android
          path: FilmCam-debug.apk
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FilmCam-verification
          path: |
            verification/
            app/build/reports/tests/
            app/build/test-results/

  deliver:
    needs: [android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: FilmCam-Android
          path: release

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: FilmCam 1.0 · build ${{ github.run_number }}
          body_path: docs/RELEASE_NOTES.md
          files: release/FilmCam-debug.apk
